version: '3'
services:
  tablero-frontend:
    build:
      context: tablero-frontend/.
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - API_TABLERO_URL:$API_TABLERO_URL
      - API_GLOBAL_URL:$API_GLOBAL_URL

    image: ${APP_NAME}-tablero-frontend
    container_name: ${APP_NAME}-tablero-frontend
#    volumes:
#      - ./frontend:/app/${APP_NAME}-fe
    ports:
      - $FRONTEND_TABLERO_LOCAL_PORT:$FRONTEND_DOCKER_PORT
    networks:
      - network # Conecta este servicio a la red ${APP_NAME}-network  


  admin-frontend:
    build:
      context: admin-frontend/.
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - API_AUTH_URL:$API_AUTH_URL
      - API_GAME_URL:$API_GAME_URL
      - API_ADMIN_URL:$API_ADMIN_URL
      - API_GEOREF_URL:$API_GEOREF_URL
    image: ${APP_NAME}-admin-frontend
    container_name: ${APP_NAME}-admin-frontend
#    volumes:
#      - ./frontend:/app/${APP_NAME}-fe
    ports:
      - $FRONTEND_ADMIN_LOCAL_PORT:$FRONTEND_DOCKER_PORT
    networks:
      - network # Conecta este servicio a la red ${APP_NAME}-network


  jugador-frontend:
    build:
      context: jugador-frontend/.
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - API_JUGADOR_URL:$API_JUGADOR_URL
      - API_GLOBAL_URL:$API_GLOBAL_URL
      - BINGO_HUB_URL:$BINGO_HUB_URL
    image: ${APP_NAME}-frontend
    container_name: ${APP_NAME}-frontend
#    volumes:
#      - ./frontend:/app/${APP_NAME}-fe
    ports:
      - $FRONTEND_JUGADOR_LOCAL_PORT:$FRONTEND_DOCKER_PORT
    networks:
      - network # Conecta este servicio a la red ${APP_NAME}-network

  backend:
    build:
      context: backend/.
      dockerfile: Dockerfile.desarrollo
    env_file:
      - .env
    environment:
      - FRONTEND_JUGADOR_URL:$FRONTEND_JUGADOR_URL
      - FRONTEND_ADMIN_URL:$FRONTEND_ADMIN_URL
      - FRONTEND_TABLERO_URL:$FRONTEND_TABLERO_URL  
    image: ${APP_NAME}-backend
    container_name: ${APP_NAME}-backend
    volumes:
      - ./backend:/app/sistema_bingo_online
    ports:
      - $BACKEND_LOCAL_PORT:$BACKEND_DOCKER_PORT
    networks:
      - network # Conecta este servicio a la red ${APP_NAME}-network

  pgadmin:
    build:
      context: ./postgresdb/pgadmin
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - $PGADMIN_LOCAL_PORT:$PGADMIN_DOCKER_PORT
    networks:
      - network

  postgres:
    build:
      context: ./postgresdb/postgres
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - $DB_LOCAL_PORT:$DB_DOCKER_PORT
    networks:
      - network

networks:
  network: # Define la red ${APP_NAME}-network
    driver: bridge # Utiliza el driver de red 'bridge' por defecto

<section class="vh-100 d-flex align-items-center">
  <div class="container">
    <!-- SPINNER -->
  <div class="overlay" *ngIf="cargando">
    <p-progressSpinner ariaLabel="loading"></p-progressSpinner>
  </div>

    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">

        <p-card styleClass="user-form text-center">

          <ng-template pTemplate="header">
            <div class="w-100 text-center">
              <h3 class="m-0 fw-bold">Verificación de Código</h3>
              <small>Ingresá el código de 6 dígitos</small>
            </div>
          </ng-template>

          <div *ngIf="message" class="alert alert-success text-center mb-3">
            {{ message }}
          </div>
          <div *ngIf="errorMessage" class="alert alert-danger text-center mb-3">
            {{ errorMessage }}
          </div>

          <form [formGroup]="codeForm" (ngSubmit)="verifyCode()" class="text-start">

            <!-- OTP INPUTS -->
            <div class="d-flex justify-content-between gap-2 mb-3">

              <input #i1 type="text" maxlength="1"
                     class="form-control text-center otp-input"
                     formControlName="d1"
                     (input)="onInput($event, i2)">

              <input #i2 type="text" maxlength="1"
                     class="form-control text-center otp-input"
                     formControlName="d2"
                     (input)="onInput($event, i3)"
                     (keydown.backspace)="onBackspace($event, i1)">

              <input #i3 type="text" maxlength="1"
                     class="form-control text-center otp-input"
                     formControlName="d3"
                     (input)="onInput($event, i4)"
                     (keydown.backspace)="onBackspace($event, i2)">

              <input #i4 type="text" maxlength="1"
                     class="form-control text-center otp-input"
                     formControlName="d4"
                     (input)="onInput($event, i5)"
                     (keydown.backspace)="onBackspace($event, i3)">

              <input #i5 type="text" maxlength="1"
                     class="form-control text-center otp-input"
                     formControlName="d5"
                     (input)="onInput($event, i6)"
                     (keydown.backspace)="onBackspace($event, i4)">

              <input #i6 type="text" maxlength="1"
                     class="form-control text-center otp-input"
                     formControlName="d6"
                     (input)="onInput($event, btnVerify)"
                     (keydown.backspace)="onBackspace($event, i5)">

            </div>

            <!-- BOTÓN -->
            <button #btnVerify
                    type="submit"
                    class="btn btn-primary w-100"
                    [disabled]="codeForm.invalid || cargando">
              Verificar código
            </button>

            <br><br>

            <!-- REENVIAR -->
            <div class="text-center">
              <span>¿No recibiste el código?</span>
              <a (click)="resendCode()" class="link-primary" style="cursor:pointer;">
                Reenviar código
              </a>
            </div>

          </form>

        </p-card>

      </div>
    </div>

  </div>
</section>

<div class="col-lg-8">

    <p-card>

        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <ng-template pTemplate="header">

            <div class="text-center py-3">

                <h2 class="fw-bold mb-1">
                    Cartón N° {{ numeroCarton }}
                </h2>

                <small class="text-muted">
                    Jugada N° {{ numeroJugada }}
                </small>

            </div>


            <!-- ================================================= -->
            <!-- BOTONES JUGADAS -->
            <!-- ================================================= -->

            <div class="text-center mb-4">

                <h6 class="fw-bold mb-3">
                    Seleccionar Jugada
                </h6>

                <button
                    *ngFor="
                        let jugada of [1,2,3,4,5,6]
                    "
                    type="button"
                    class="btn btn-outline-primary me-2 mb-2"

                    [class.active]="
                        numeroJugada === jugada
                    "

                    (click)="
                        cambiarJugada(jugada)
                    ">

                    Jugada {{ jugada }}

                </button>

            </div>


            <!-- ================================================= -->
            <!-- BOLILLERO -->
            <!-- ================================================= -->

            <div class="mb-4 px-3">

                <div class="bolillero">

                    <div
                        class="bola"

                        *ngFor="
                            let bola of bolasSorteadas;
                            let ultima = last
                        "

                        [class.ultima]="ultima">

                        {{ bola }}

                    </div>

                </div>

            </div>

        </ng-template>


        <!-- ================================================= -->
        <!-- CARTÓN -->
        <!-- ================================================= -->

        <div class="carton">

            <div
                class="fila"

                *ngFor="
                    let fila of carton
                ">

                <button
                    *ngFor="
                        let numero of fila
                    "

                    type="button"

                    class="casilla"

                    [class.vacia]="
                        numero.valor === null
                    "

                    [class.marcada]="
                        numero.marcado
                    "

                    [disabled]="true">

                    {{ numero.valor ?? '' }}

                </button>

            </div>

        </div>

    </p-card>

</div>
